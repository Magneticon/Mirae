        <SCRIPT TYPE="TEXT/JAVASCRIPT">
            function RUN(type){
                GtE("OUT").value = "";
                var d1 = GtE("INP").value;
                var H = d1.split(/\n/);
                var S = GtE("SUFFIX").value;
                var P = GtE("PREFIX").value;
                var M = [GtE("MIDFIX01").value, GtE("MIDFIX02").value, GtE("MIDFIX03").value];
                var R = "";
                var SK = false;
                for (var i = 0; i < H.length; i++){
                    SK = false;
                    var LN = H[i];
                    if (H[i].trim().startsWith("%c?", 0))
                        SK = true;
                    if (H[i].trim().startsWith("%n?", 0)){
                        H[i] = "";
                        SK = false;
                    }
                    if (type && !SK)
                        H[i] = "";
                    if (R != "") R += "\n";
                    var W = "";
                    if (!SK){
                        W = P;
                        for (var mi = 0; mi < M.length; mi++){
                            if (M[mi] != "")
                                W += ""+H[i].trim()+""+M[mi]+"";
                        }
                        W = W+""+H[i].trim()+""+S;
                    }
                    else
                        W = H[i].trim();
                    W = W.replaceAll("%i?", i);
                    W = W.replaceAll("%j?", (i-1));
                    W = W.replaceAll("%ln?", LN);
                    R += W.trim();
                }
                R = R.replaceAll("%il?", i);
                R = R.replaceAll("%jl?", (i-1));
                R = R.replaceAll("%c?", "");
                R = R.replaceAll("%n?", "");
                R = R.replaceAll("%i?", "");
                R = R.replaceAll("%ln?", "");
                R = R.replaceAll("%r?", "\n");
                GtE("OUT").value = R;
                GtE("RECORDS").innerHTML = i;
            }
            
            function GtE(id){
                return document.getElementById(id);
            }
        </SCRIPT>
